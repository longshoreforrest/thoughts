<noscript><div class="panel"><strong>This page needs JavaScript for the interactive tabs.</strong> Short answer: Yann LeCun is a consistent, qualified LLM skeptic since at least 2022 — he doubts that scaling language models or training on text alone leads to human-level intelligence, while calling LLMs useful. He does not criticise the Transformer architecture itself — in his own words, “the problem isn't that it is a transformer, the problem is that it is an auto-regressive LLM” — though in practice every frontier LLM is a Transformer, so the two overlap. Many of his specific claims about what LLMs cannot do (reasoning, planning) have not held up by November 2026; claims about missing persistent memory and weak physical understanding have held up better; his central bet — world models replacing LLMs — is still open.</div></noscript>

en:{
 h1:"Is Yann LeCun an <em>LLM and Transformer skeptic</em>?",
 sub:"A dated, sourced look at what he has said since 2022 — and how it holds up against the state of AI in November 2026",
 authnote:"<strong><a class=\"anlink\" href=\"https://longshoreforrest.github.io/myself/\" target=\"_blank\" rel=\"author noopener\" title=\"https://longshoreforrest.github.io/myself/\">Author's note.</a></strong> I have great respect for Yann LeCun and his work. His 1980s and 1990s contributions — convolutional neural networks, an early version of backpropagation, and being the first to train a convolutional network on images of handwritten digits — are among the foundations of modern deep learning, and he shared the 2018 Turing Award with Geoffrey Hinton and Yoshua Bengio (<a href=\"https://www.acm.org/media-center/2019/march/turing-award-2018\" target=\"_blank\" rel=\"noopener\">ACM</a>). <details class=\"fold inl\" data-k=\"an\"><summary>Read more</summary>Whether language models are the right path to human-level AI is a genuine scientific question, and LeCun is often the one asking the hard questions the field needs. This page does not try to diminish his achievements. It simply lines up his dated public statements about LLMs against publicly reported results as of November 2026 — an exercise in checking predictions, which is hard for everyone. I am not affiliated with LeCun, Meta or AMI Labs.</details>",
 tr:"<strong>What about Transformers?</strong> Since 2023 essentially every frontier LLM has been a Transformer (mostly mixture-of-experts variants; hybrids with state-space layers and diffusion decoders exist but haven’t displaced it), so in practice “LLM skeptic” and “Transformer skeptic” describe the same systems. Conceptually they differ, and LeCun separates them himself: <em>“The problem isn't that it is a transformer. The problem is that it is an auto-regressive LLM.”</em> (<a href=\"https://x.com/ylecun/status/1804834054954459539\" target=\"_blank\" rel=\"noopener\">X, 23 Jun 2024</a>). <details class=\"fold inl\" data-k=\"tr\"><summary>Evidence and caveats</summary><ul class=\"plain\"><li>He defends the Transformer’s inductive bias: it is permutation-equivariant, as ConvNets are translation-equivariant (<a href=\"https://x.com/ylecun/status/1769781813835182575\" target=\"_blank\" rel=\"noopener\">X, 18 Mar 2024</a>).</li><li>He lists “scaling up a giant transformer trained on sequences of tokenized inputs” as one belief he does not share (<a href=\"https://x.com/ylecun/status/1526673232635600897\" target=\"_blank\" rel=\"noopener\">X, 17 May 2022</a>).</li><li>His own JEPA line reportedly uses Vision Transformer encoders and predictors, per secondary sources (<a href=\"https://arxiv.org/pdf/2603.14482\" target=\"_blank\" rel=\"noopener\">V-JEPA 2.1 on arXiv</a>, <a href=\"https://learnopencv.com/v-jepa-2-meta-world-model-robotics-guide/\" target=\"_blank\" rel=\"noopener\">Learn OpenCV guide</a>) — I did not read the original papers.</li><li><strong>The line is not perfectly clean.</strong> The “fixed computation per token” part of his argument concerns a property of the standard decoder-only Transformer, and his 2026 statements (“the very idea of a generative model does not work in the real world”) go beyond autoregression to the whole generative paradigm.</li><li>I found no LeCun statements on Mamba, state-space models or diffusion language models, so I claim nothing about them.</li></ul><em>Evidence level: good for “he does not criticise the Transformer block” (his own words), weak for anything beyond that. Quotes come from search-result excerpts; I did not open the X pages.</em></details>",

const LEAD=T(
"<strong>Lyhyt vastaus.</strong><ul class=\"plain qa\"><li><strong>Onko hän LLM-skeptikko? Kyllä — johdonmukaisesti, ainakin kesäkuusta 2022.</strong> Hän epäilee, että kielimallien skaalaus tai pelkkä tekstikoulutus johtaa ihmistason älyyn, ja on sanonut niin haastatteluissa, puheissa ja esseissä vuoteen 2026 asti. Skeptisyys on kuitenkin ehdollista: hän pitää LLM:iä hyödyllisinä ja odottaa niiden säilyvän esim. isompien järjestelmien \"orkestroijana\".</li><li><strong>Onko hän Transformer-skeptikko? Ei arkkitehtuurin mielessä — mutta käytännössä rajanveto on häilyvä.</strong> Jokainen vuosien 2023–2026 huipputason LLM on Transformer-pohjainen, joten “LLM” ja “Transformer” eivät eroa toisistaan empiirisesti. LeCun erottaa ne itse (kesäkuu 2024): “The problem isn't that it is a transformer. The problem is that it is an auto-regressive LLM.” Hänen vastaväitteensä kohdistuvat <em>tavoitteeseen</em> (seuraavan tokenin ennustus), <em>dataan</em> (pelkkä teksti) ja <em>paradigmaan</em> (tokenien generointi sen sijaan että ennustettaisiin opitussa esitystilassa), eivät attentioniin tai Transformer-lohkoon (ks. alla).</li><li><strong>Miten yksittäiset väitteet ovat kestäneet?</strong> Vaihtelevasti (ks. tulostaulu). Väitteet siitä mitä LLM:t <em>eivät voi tehdä</em> (päättely, suunnittelu) ovat kestäneet huonoiten; väitteet pysyvän muistin puutteesta ja heikosta fysiikan ymmärryksestä parhaiten; keskeinen veto — maailmamallit korvaavat LLM:t — on yhä auki, ensimmäinen testi 2027 alussa.</li></ul>",
"<strong>Short answer.</strong><ul class=\"plain qa\"><li><strong>Is he an LLM skeptic? Yes — consistently, since at least June 2022.</strong> He doubts that scaling language models, or training on text alone, leads to human-level intelligence, and has said so in interviews, talks and essays through 2026. It is a qualified skepticism, though: he calls LLMs useful and expects them to remain, e.g. as an \"orchestrator\" inside larger systems.</li><li><strong>Is he a Transformer skeptic? Not in the architectural sense — though in practice the line is blurry.</strong> Every frontier LLM of 2023–2026 is Transformer-based, so “LLM” and “Transformer” cannot be told apart empirically. LeCun separates them himself (June 2024): “The problem isn't that it is a transformer. The problem is that it is an auto-regressive LLM.” His objections target the <em>objective</em> (next-token prediction), the <em>data</em> (text only) and the <em>paradigm</em> (generating tokens rather than predicting in a learned representation space), not attention or the Transformer block (see below).</li><li><strong>How have his specific claims held up?</strong> Mixed (see the scoreboard). Claims about what LLMs <em>cannot do</em> (reasoning, planning) have fared worst; claims about missing persistent memory and weak physical understanding have fared best; the central bet — that world models will replace LLMs — is still open, with a first test in early 2027.</li></ul>");
const DEFENCE=T(
"<ul class=\"plain\"><li><strong>\"Puhdas autoregressiivinen LLM\" ≠ nykyjärjestelmä.</strong> Hän voi sanoa, että RL, haku, työkalut ja multimodaalisuus tekevät nykyjärjestelmistä jotain muuta kuin hänen kritisoimansa mallit. Silloin ydinväite (\"LLM-<em>paradigma</em> ei riitä\") siirtyy — ja siitä on vaikea hävitä, koska rajaa ei voi mitata.</li><li><strong>Benchmark ≠ ymmärrys.</strong> Saturoituneet testit, vuotanut data, harness-riippuvuus (ARC-AGI-3: 70 % vs 100 %) ja HLE:n väärät vastaukset (~30 % osassa) heikentävät päätelmiä.</li><li><strong>Hän voi olla oikeassa arkkitehtuurista silti.</strong> Muisti, fysiikka ja datatehokkuus ovat juuri ne alueet joissa LLM:t yhä horjuvat — ja joita maailmamallit lupaavat korjata. Sitä ei ole vielä testattu.</li><li><strong>Moni väite oli aikataulu-, ei kykyväite.</strong> Ne ratkeavat vasta 2027–2031.</li></ul>",
"<ul class=\"plain\"><li><strong>“Pure autoregressive LLM” ≠ today's systems.</strong> He can say RL, search, tools and multimodality make current systems something other than the models he criticised. Then the core claim (“the LLM <em>paradigm</em> isn't enough”) shifts — and it is hard to lose because the boundary can't be measured.</li><li><strong>Benchmark ≠ understanding.</strong> Saturated tests, leaked data, harness dependence (ARC-AGI-3: 70% vs 100%) and HLE's wrong answers (~30% in a subset) weaken conclusions.</li><li><strong>He can still be right about architecture.</strong> Memory, physics and sample efficiency are exactly where LLMs still falter — and where world models promise to help. That hasn't been tested yet.</li><li><strong>Many claims were timelines, not capability claims.</strong> They resolve only in 2027–2031.</li></ul>");
const METHOD=T(
"<strong>Menetelmä ja rajoitukset:</strong> {N} väitettä on poimittu sitaattilistasta ja luokiteltu kirjoittajan arvion mukaan; ne eivät ole kaikki hänen sanomansa asiat. Nykytila perustuu marraskuun 2026 verkkohakuun: kärkibenchmarkit ARC Prizen, Artificial Analysisin ja Stanfordin AI Indexin sivuilta luettuna, loput toissijaisista lähteistä. <em>Malleja, nimiä ja lukuja ei ole itsenäisesti toistettu.</em> Moni tulos on valmistajan omaa raportointia. Tarkista avainluvut linkkien takaa ennen jakamista.",
"<strong>Method and limits:</strong> the {N} claims were drawn from the quotes list and classified by the author's judgement; they aren't everything he has said. The current state rests on November 2026 web search: top benchmarks read from ARC Prize, Artificial Analysis and the Stanford AI Index; the rest from secondary sources. <em>Models, names and figures were not independently reproduced.</em> Many results are vendors' own reporting. Check key figures at the links before sharing.");

const $=id=>document.getElementById(id);

let lang=store.get('lecun_lang')||'en', theme=store.get('lecun_theme')||'myself';
if(!I18N[lang])lang='fi'; if(!['myself','light','dark','paper'].includes(theme))theme='myself';
let tab=(location.hash||'').replace('#','')||'summary';
if(!['summary','claims','state','quotes'].includes(tab))tab='summary';
const openSet=new Set(['sum-topic','sum-open','s-reason']);
const isOpen=k=>openSet.has(k)?' open':'';

const L=o=>o[lang];

const years=[...new Set(DATA.map(x=>x.d.slice(0,4)))].sort();

function chips(el,vals,cur,set,label){el.innerHTML='';[null,...vals].forEach(v=>{const b=document.createElement('button');b.className='chip'+(cur()===v?' on':'');b.textContent=v?(label?label(v):v):TT().all;b.onclick=()=>{set(v);render()};el.appendChild(b)})}
const vBadge=v=>`<span class="v v-${v}">${VERD[v][lang]}</span>`;

function applyStatic(){
  document.documentElement.lang=lang;
  document.documentElement.dataset.theme=theme;
  document.title=lang==='en'?'Is Yann LeCun an LLM and Transformer skeptic? A sourced look (Nov 2026)':'Onko Yann LeCun LLM- ja Transformer-skeptikko? (marraskuu 2026)';
  document.querySelectorAll('[data-i18n]').forEach(e=>e.textContent=String(TT()[e.dataset.i18n]).replace('{N}',CLAIMS.length));
  document.querySelectorAll('[data-i18n-html]').forEach(e=>{const k=e.dataset.i18nHtml;e.innerHTML=({s_def:L(DEFENCE),s_method:L(METHOD).replace('{N}',CLAIMS.length)})[k]||TT()[k]});

function renderQuotes(){
  chips($('years'),years,()=>yearSel,v=>yearSel=v);
  chips($('tagbar'),tags,()=>tagSel,v=>tagSel=v,tagName);
  chips($('qVerd'),Object.keys(VERD),()=>qVerdSel,v=>{qVerdSel=v;track('filter_verdict',{verdict:v||'all'})},k=>VERD[k][lang]);
  const f=$('from').value,t=$('to').value,q=$('q').value.toLowerCase().trim();
  let rows=DATA.filter(x=>(!yearSel||x.d.startsWith(yearSel))&&(!tagSel||x.tags.includes(tagSel))&&(!qVerdSel||CLAIMS.some(c=>c.dates.includes(x.d)&&c.verdict===qVerdSel))&&(!f||x.d>=f)&&(!t||x.d<=t)&&(!q||(x.q.join(' ')+x.gist+x.gistE+x.ev+x.evE+x.src).toLowerCase().includes(q)));
  rows.sort((a,b)=>desc?b.d.localeCompare(a.d):a.d.localeCompare(b.d));
  $('sort').textContent=desc?TT().newest:TT().oldest;
  $('count').textContent=TT().count(rows.length,rows.reduce((n,x)=>n+x.q.length,0));
  $('empty').style.display=rows.length?'none':'block';
  const en=lang==='en';
  $('list').innerHTML=rows.map(x=>{const note=en?x.nE:x.n;return `<div class="item"><div class="date">${fmt(x.d)}</div><div class="ev">${esc(en?x.evE:x.ev)}</div><div class="gist">${esc(en?x.gistE:x.gist)}</div>${qBlock(x)}<div class="tags">${x.tags.map(t=>`<span class="tag">${esc(tagName(t))}</span>`).join('')}</div>${lightRow(x)}<div class="src">${TT().src}: <a href="${x.url}" target="_blank" rel="noopener">${esc(x.src)}</a><span class="badge ${x.v==1?'b1':'b2'}">${x.v==1?TT().b1:TT().b2}</span>${note?`<div class="note">${note}</div>`:''}</div></div>`}).join('');
}

function renderState(){
  $('stLead').innerHTML=TT().st_lead;
  $('stateList').innerHTML=STATE.map(s=>`<details class="scard fold" data-k="s-${s.id}"${isOpen('s-'+s.id)}><summary><div><h3>${s.ic} ${L(s.title)}</h3><div class="headline">${L(s.head)}</div></div></summary>${s.rows.map(r=>{const v=typeof r.v==='string'?r.v:L(r.v);return `<div class="metric"><div class="lab">${L(r.l)}</div><div class="val">${v}</div><div class="nt">${L(r.n)}<div class="links">${confB(r.c)} <a href="${r.u}" target="_blank" rel="noopener">${esc(r.s||'link')}</a>${r.u2?` <a href="${r.u2}" target="_blank" rel="noopener">+</a>`:''}</div></div></div>`}).join('')}</details>`).join('')+`<div class="panel note">${L(STATE_GAPS)}</div>`;
}

function renderClaims(){
  chips($('cVerd'),Object.keys(VERD),()=>cVerd,v=>cVerd=v,k=>VERD[k][lang]);
  chips($('cTopic'),Object.keys(TOPICS),()=>cTopic,v=>cTopic=v,k=>TOPICS[k][lang]);
  const rows=CLAIMS.filter(c=>(!cVerd||c.verdict===cVerd)&&(!cTopic||c.topic===cTopic)).sort((a,b)=>VERD[a.verdict].ord-VERD[b.verdict].ord);
  $('cCount').textContent=TT().c_count(rows.length);
  $('claimList').innerHTML=rows.map(c=>{
    const srcs=c.dates.map(d=>dq(d)).filter(Boolean).map(x=>`<a href="${x.url}" target="_blank" rel="noopener">${fmt(x.d)} · ${esc(x.src)}</a>`).join(' ');
    const tz=L(c.now).replace(/<[^>]+>/g,'').slice(0,150).replace(/&[a-z#0-9]*$/,'')+'…';
    return `<div class="item claim c-${c.verdict}" id="${c.id}"><div class="head">${vBadge(c.verdict)}<span class="tag">${L(TOPICS[c.topic])}</span><span class="strength">${TT().c_strength}: ${dots(c.st)}</span></div>
    <div class="gist">${L(c.claim)}</div><blockquote>“${esc(c.q)}”</blockquote>
    <div class="links">${TT().c_src}: ${srcs}</div>
    <details class="fold inl" data-k="c-${c.id}"${isOpen('c-'+c.id)}><summary><div><span class="sl">${TT().c_details}</span><span class="teaser">${tz}</span></div></summary><div class="cols"><div class="col"><h4>${TT().c_now}</h4>${L(c.now)}</div><div class="col"><h4>${TT().c_caveat}</h4>${L(c.cav)}</div></div>
    <div class="links">${TT().c_ev}: ${c.ev.map(e=>`<a href="${e[1]}" target="_blank" rel="noopener">${esc(e[0])}</a>`).join('')}</div></details></div>`}).join('');
}

function jump(id){tab='claims';cVerd=null;cTopic=null;history.replaceState(null,'','#claims');render();const e=document.getElementById(id);if(e)e.scrollIntoView({behavior:'smooth',block:'start'})}

function renderSummary(){
  $('sumLead').innerHTML=L(LEAD);
  const nq=DATA.reduce((n,x)=>n+x.q.length,0);
  $('stats').innerHTML=[[CLAIMS.length,TT().stat_claims],[DATA.length,TT().stat_sources],[nq,TT().stat_quotes],[OPEN_BETS.length,TT().stat_bets]].map(a=>`<div class="stat"><b>${a[0]}</b><span>${a[1]}</span></div>`).join('');
  const cnt={};Object.keys(VERD).forEach(k=>cnt[k]=0);CLAIMS.forEach(c=>cnt[c.verdict]++);
  const tot=CLAIMS.length;
  $('bar').innerHTML=Object.keys(VERD).filter(k=>cnt[k]).map(k=>`<div class="s-${k}" style="width:${cnt[k]/tot*100}%" title="${VERD[k][lang]}">${cnt[k]}</div>`).join('');
  $('legend').innerHTML=Object.keys(VERD).map(k=>`<span><span class="k s-${k}" style="background:${({wrong:'#d64545',pess:'#e08a1e',part:'#c9a400',right:'#2f9e6b',open:'#6b7bd6'})[k]}"></span>${VERD[k][lang]} (${cnt[k]})</span>`).join('');
  const list=(vs,key)=>{const a=CLAIMS.filter(c=>vs.includes(c.verdict)).sort((x,y)=>y.st-x.st).map(c=>`<li><a class="jump" onclick="jump('${c.id}')">${L(c.claim)}</a> ${vBadge(c.verdict)}</li>`);const N=4;return a.slice(0,N).join('')+(a.length>N?`<li class="morefold"><details class="fold inl" data-k="${key}"${isOpen(key)}><summary>${TT().show_n(a.length-N)}</summary><ul class="plain tl">${a.slice(N).join('')}</ul></details></li>`:'')};
  $('listWrong').innerHTML=list(['wrong','pess'],'more-w');
  $('listRight').innerHTML=list(['right','part'],'more-r');
  $('topicTable').innerHTML=`<tr><th>${TT().th_topic}</th><th>${TT().th_verd}</th><th>${TT().th_why}</th></tr>`+Object.keys(TOPIC_SUM).map(k=>`<tr><td>${L(TOPICS[k])}</td><td>${vBadge(TOPIC_SUM[k].v)}</td><td>${L(TOPIC_SUM[k].why)}</td></tr>`).join('');
  $('openTable').innerHTML=`<tr><th>${TT().th_bet}</th><th>${TT().th_when}</th><th>${TT().th_status}</th></tr>`+OPEN_BETS.map(o=>`<tr><td>${L(o.bet)}</td><td>${L(o.when)}</td><td>${L(o.st)}</td></tr>`).join('');
}

const track=(n,p)=>{try{if(window.mypa&&window.mypa.send)window.mypa.send(n,p||{})}catch(e){}};
document.addEventListener('click',e=>{const a=e.target.closest&&e.target.closest('a[href^="http"]');if(a){try{track('outbound_click',{host:new URL(a.href).hostname,tab:tab})}catch(_){}}});
document.addEventListener('toggle',e=>{const d=e.target;if(d&&d.tagName==='DETAILS'&&d.dataset&&d.dataset.k){if(d.open)openSet.add(d.dataset.k);else openSet.delete(d.dataset.k)}},true);
function syncDetails(){document.querySelectorAll('details[data-k]').forEach(d=>{const w=openSet.has(d.dataset.k);if(d.open!==w)d.open=w})}
document.querySelectorAll('[data-fold]').forEach(b=>b.addEventListener('click',()=>{const root=document.getElementById(b.dataset.fold);if(!root)return;root.querySelectorAll('details[data-k]').forEach(d=>{const o=b.dataset.act==='open';d.open=o;if(o)openSet.add(d.dataset.k);else openSet.delete(d.dataset.k)})}));
const bq=q=>`<blockquote>“${esc(q)}”</blockquote>`;
function qBlock(x){const a=x.q,k='q-'+x.d;if(a.length<=2)return a.map(bq).join('');return a.slice(0,2).map(bq).join('')+`<details class="fold inl" data-k="${k}"${isOpen(k)}><summary>${TT().more_q(a.length-2)}</summary>${a.slice(2).map(bq).join('')}</details>`}
const escA=s=>esc(s).replace(/"/g,'&quot;');
const claimsFor=d=>CLAIMS.filter(c=>c.dates.includes(d));
function lightRow(x){const cl=claimsFor(x.d);if(!cl.length)return '';return `<div class="lightrow"><span class="lh">${TT().light_h}:</span>${cl.map(c=>`<button type="button" class="v v-${c.verdict}" data-open="${x.d}" data-claim="${c.id}" title="${escA(L(c.claim))}">${VERD[c.verdict][lang]} · ${L(TOPICS[c.topic])}</button>`).join('')}</div>`}
function modalCard(c){return `<div class="item claim c-${c.verdict}" id="m-${c.id}"><div class="head">${vBadge(c.verdict)}<span class="tag">${L(TOPICS[c.topic])}</span><span class="strength">${TT().c_strength}: ${dots(c.st)}</span></div><div class="gist">${L(c.claim)}</div><blockquote>“${esc(c.q)}”</blockquote><div class="cols"><div class="col"><h4>${TT().c_now}</h4>${L(c.now)}</div><div class="col"><h4>${TT().c_caveat}</h4>${L(c.cav)}</div></div><div class="links">${TT().c_ev}: ${c.ev.map(e=>`<a href="${e[1]}" target="_blank" rel="noopener">${esc(e[0])}</a>`).join('')}</div><div class="links"><a href="#claims" onclick="event.preventDefault();closeModal();jump('${c.id}')">${TT().m_goto} →</a></div></div>`}
function fillModal(scroll){if(!modalState)return;const x=dq(modalState.d);if(!x)return;const en=lang==='en';
  $('mTitle').textContent=TT().light_h;$('mSub').textContent=fmt(x.d)+' · '+(en?x.evE:x.ev)+' — '+(en?x.gistE:x.gist);$('mNote').textContent=TT().m_note;$('mClose').setAttribute('aria-label',TT().m_close);
  $('mBody').innerHTML=claimsFor(x.d).map(modalCard).join('');
  if(scroll){const e=document.getElementById('m-'+modalState.id);if(e)e.scrollIntoView({block:'nearest'})}}
function openModal(d,id){track('claim_popup',{claim:id,quote_date:d});modalState={d,id};fillModal(true);$('modalBg').hidden=false;document.body.classList.add('noscroll');$('mClose').focus()}
function closeModal(){modalState=null;$('modalBg').hidden=true;document.body.classList.remove('noscroll')}
$('list').addEventListener('click',e=>{const b=e.target.closest('[data-open]');if(b)openModal(b.dataset.open,b.dataset.claim)});
$('mClose').onclick=closeModal;
$('modalBg').addEventListener('click',e=>{if(e.target.id==='modalBg')closeModal()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&modalState)closeModal()});

const TRK={
 h:TE("LeCun's prediction track record, in the light of November 2026","LeCunin ennustetarkkuus marraskuun 2026 valossa"),
 sub:TE("The author's summary of how his dated claims on this page have held up against public evidence.","Kirjoittajan tiivistelmä siitä, miten tämän sivun päivätyt väitteet ovat kestäneet julkista näyttöä vasten."),
 bottom:TE("<strong>A split decision: strong diagnoses, ceilings set too low.</strong> LeCun has been right about <em>where today's systems are weak</em> — persistent memory, physical and commonsense understanding, data efficiency. He has been wrong about <em>how hard those weaknesses would be to overcome</em>: his claims of structural impossibility (reasoning, planning, error compounding) have fared worst, and models went through limits he treated as walls. His timeline bets — LLMs largely obsolete by roughly 2028–31, a paradigm shift “obvious” by early 2027 — have not been tested yet.","<strong>Tasapeli: vahvat diagnoosit, liian matalat katot.</strong> LeCun on ollut oikeassa siinä, <em>missä nykyjärjestelmät ovat heikkoja</em> — pysyvä muisti, fysiikan ja maalaisjärjen ymmärrys, datatehokkuus. Hän on ollut väärässä siinä, <em>kuinka vaikeaa heikkouksien voittaminen on</em>: rakenteellista mahdottomuutta koskevat väitteet (päättely, suunnittelu, virheiden kasautuminen) ovat kestäneet huonoiten, ja mallit ovat ylittäneet rajoja, joita hän piti seininä. Hänen aikatauluvetonsa — LLM:t käytännössä vanhentuneita noin 2028–31, paradigmamuutos “ilmeinen” 2027 alussa — ovat vielä testaamatta."),
 rate:(res,held,against,open,pct)=>({en:`Of the <strong>${res}</strong> claims that can already be judged, <strong>${held}</strong> held up (fully or partly) and <strong>${against}</strong> did not — a hit rate of about <strong>${pct}%</strong>. A further <strong>${open}</strong> are still open.`,fi:`Niistä <strong>${res}</strong> väitteestä, jotka voidaan jo arvioida, <strong>${held}</strong> kesti (kokonaan tai osin) ja <strong>${against}</strong> ei kestänyt — osumatarkkuus noin <strong>${pct} %</strong>. Lisäksi <strong>${open}</strong> on vielä auki.`}),
 held:TE("Held up","Kestivät"),miss:TE("Did not hold up","Eivät kestäneet"),open:TE("Still open","Vielä auki"),
 cols_h:TE("Show the claims behind this (held up / did not hold up / still open)","Näytä taustalla olevat väitteet (kestivät / eivät kestäneet / vielä auki)"),
 how_h:TE("How to read this","Näin tämä luetaan"),
 how:TE("The classification is the author's judgement. The claims come from the quotes on this page and are not a random sample of everything LeCun has said, so selection bias is possible. Many “did not hold up” calls rest on benchmark results, some reported by the vendors themselves, and benchmarks are not general intelligence. LeCun might reasonably answer that his claims concerned <em>pure autoregressive LLMs</em>, not today's systems with reinforcement learning, search and tools. Timeline bets cannot be scored until their deadlines pass. Open the other tabs for each claim's evidence and sources.","Luokittelu on kirjoittajan arvio. Väitteet on poimittu tämän sivun sitaateista, eivätkä ne ole satunnaisotos kaikesta, mitä LeCun on sanonut, joten valintaharha on mahdollinen. Moni “ei kestänyt” -arvio perustuu benchmark-tuloksiin, osa valmistajien omiin raportteihin, eivätkä benchmarkit ole yleistä älykkyyttä. LeCun voi perustellusti vastata, että hänen väitteensä koskivat <em>puhtaita autoregressiivisiä LLM:iä</em>, ei nykyjärjestelmiä, joissa on vahvistusoppimista, hakua ja työkaluja. Aikatauluvetoja ei voi pisteyttää ennen kuin määräajat umpeutuvat. Muilta välilehdiltä löytyvät kunkin väitteen perustelut ja lähteet.")};
function renderTrack(){
 const against=CLAIMS.filter(c=>['wrong','pess'].includes(c.verdict)),held=CLAIMS.filter(c=>['right','part'].includes(c.verdict)),open=CLAIMS.filter(c=>c.verdict==='open');
 const res=against.length+held.length,pct=res?Math.round(held.length/res*100):0;
 const cnt={};Object.keys(VERD).forEach(k=>cnt[k]=0);CLAIMS.forEach(c=>cnt[c.verdict]++);
 const bar=Object.keys(VERD).filter(k=>cnt[k]).map(k=>`<div class="s-${k}" style="width:${cnt[k]/CLAIMS.length*100}%" title="${VERD[k][lang]}">${cnt[k]}</div>`).join('');
 const col=(arr,cls,h)=>`<div class="tcol t-${cls}"><h4>${L(h)} (${arr.length})</h4><ul>${arr.slice().sort((a,b)=>b.st-a.st).map(c=>`<li><a class="jump" onclick="jump('${c.id}')">${L(CLAIM_SHORT[c.id]||{en:c.id,fi:c.id,[lang]:c.id})}</a><span class="v v-${c.verdict} sm">${VERD[c.verdict][lang]}</span></li>`).join('')}</ul></div>`;
 const r=TRK.rate(res,held.length,against.length,open.length,pct);
 $('track').innerHTML=`<h3>${L(TRK.h)}</h3><div class="tsub">${L(TRK.sub)}</div><div class="bar">${bar}</div><div class="trate">${r[lang]}</div><div class="tbottom">${L(TRK.bottom)}</div><details class="fold inl" data-k="trk-cols"${isOpen('trk-cols')}><summary>${L(TRK.cols_h)}</summary><div class="tcols">${col(held,'held',TRK.held)}${col(against,'miss',TRK.miss)}${col(open,'open',TRK.open)}</div></details><details class="fold inl" data-k="trk-how"${isOpen('trk-how')}><summary>${L(TRK.how_h)}</summary><div class="note">${L(TRK.how)}</div></details>`;}
function stickyOffset(){const sb=document.querySelector('.sitebar'),tb=document.getElementById('tabs');return (sb?sb.offsetHeight:0)+(tb?tb.offsetHeight:0)}
function keepTabsInView(){const panel=document.getElementById('tab-'+tab);if(!panel)return;const target=panel.getBoundingClientRect().top+window.scrollY-stickyOffset()-8;if(window.scrollY>target)window.scrollTo({top:Math.max(0,target),behavior:'instant'})}
function render(){
  applyStatic();
  renderTrack();renderSummary();renderClaims();renderState();renderQuotes();
  syncDetails();
  if(modalState)fillModal(false);
}
$('from').oninput=$('to').oninput=$('q').oninput=render;
$('sort').onclick=()=>{desc=!desc;render()};
$('reset').onclick=()=>{yearSel=tagSel=qVerdSel=null;$('from').value=$('to').value=$('q').value='';render()};
document.querySelectorAll('#langSeg button').forEach(b=>b.onclick=()=>{lang=b.dataset.lang;track('lang_change',{lang:lang});store.set('lecun_lang',lang);render()});
document.querySelectorAll('#themeSeg button').forEach(b=>b.onclick=()=>{theme=b.dataset.th;track('theme_change',{theme:theme});store.set('lecun_theme',theme);render()});
document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;track('tab_view',{tab:tab});history.replaceState(null,'','#'+tab);render();keepTabsInView()});
window.addEventListener('hashchange',()=>{const h=location.hash.replace('#','');if(['summary','claims','state','quotes'].includes(h)){tab=h;render()}});
render();
</script>

<script>
/*!
 * MyPublicAnalytics beacon — selainpuolen snippet.
 *
 * Lähetys:
 *   - 'pageview' automaattisesti sivun latautuessa
 *   - Custom-eventit: window.mypa.send('section_view', { section: 'experience' })
 *
 * Sivukohtainen perus-extra (valinnainen, aseta ennen latausta):
 *   window.__MYPA_EXTRA__ = { assignment: '0018' };   // liitetään joka eventtiin
 *
 * HUOM: lähetettävä `path` on pathname + search — location.hash EI koskaan
 * kulje mukana. Salatut sivut (MyAssistant) pitävät purkuavaimen juuri
 * #-osassa, joten avain ei päädy analytiikkaan.
 *
 * Käyttää navigator.sendBeacon() (eloonjäänti sivu-vaihdoksen yli) ja
 * fetch keepalive:n fallbackia.
 *
 * Self-tagging (oman vierailusi erottelu):
 *   Käy kerran sivulla URL:lla ?_mypa_self=1 → localStorageen tallentuu lippu,
 *   ja kaikki tulevat eventit lähetetään {self:true}. Pois: ?_mypa_self=0.
 */
(function () {
  if (typeof window === "undefined") return;
  if (window.mypa && window.mypa.__initialized) return;

  var SITE = window.__MYPA_SITE__ || "unknown";
  var ENDPOINT = window.__MYPA_ENDPOINT__ || "";
  var AUTO_EVENT = window.__MYPA_AUTO_EVENT__ || "pageview";

  if (!ENDPOINT) return;

  // Perus-extra, joka liitetään JOKAISEEN tämän sivun eventtiin. Julkaisija
  // asettaa tämän ennen beaconin latausta, esim. MyAssistantin salattu
  // raportti: window.__MYPA_EXTRA__ = { assignment: '0018', doc: 0 }.
  // Näin sivukohtainen identiteetti kulkee mukana ilman että polkuun tai
  // otsikkoon tarvitsee laittaa mitään sisällöstä kertovaa.
  var BASE_EXTRA = null;
  try {
    var be = window.__MYPA_EXTRA__;
    if (be && typeof be === "object") BASE_EXTRA = be;
  } catch (e) {}

  // Self-marker: URL-parametri tai localStorage-lippu.
  var SELF = false;
  try {
    var sp = new URLSearchParams(window.location.search);
    if (sp.get("_mypa_self") === "1") {
      try { localStorage.setItem("mypa_self", "1"); } catch (e) {}
    } else if (sp.get("_mypa_self") === "0") {
      try { localStorage.removeItem("mypa_self"); } catch (e) {}
    }
    try { SELF = localStorage.getItem("mypa_self") === "1"; } catch (e) {}
  } catch (e) {}

  function utm() {
    try {
      var p = new URLSearchParams(window.location.search);
      return {
        source: p.get("utm_source") || null,
        medium: p.get("utm_medium") || null,
        campaign: p.get("utm_campaign") || null,
      };
    } catch (e) {
      return { source: null, medium: null, campaign: null };
    }
  }

  // Käyttäjäidentiteetti (esim. Google Sign-In) jaetusta localStoragesta.
  // Kirjoitettu muotoon { email, name, sub, idToken, t }. Worker varmentaa
  // idTokenin RS256/JWKS:llä; user-kenttä on varauloskäynti (varmentamaton).
  var IDENTITY_KEY = window.__MYPA_IDENTITY_KEY__ || "unitas:identity";
  function identity() {
    try {
      var raw = localStorage.getItem(IDENTITY_KEY);
      if (!raw) return null;
      var o = JSON.parse(raw);
      if (!o || !o.email) return null;
      return o;
    } catch (e) {
      return null;
    }
  }

  // Korkean entropian UA Client Hints (tarkka laitemalli). Vain Chromium.
  // navigator.userAgentData.getHighEntropyValues on asynkroninen, joten
  // populoimme tämän kertaalleen ja liitämme sen kaikkiin lähetettäviin
  // eventteihin. resolveHighEntropy() kutsuu callbackin joka tapauksessa —
  // myös silloin kun rajapintaa ei ole tai se hylkää — jottei pageview jää
  // lähettämättä.
  var UACH = null;
  function resolveHighEntropy(cb) {
    try {
      var uad = navigator.userAgentData;
      if (uad && typeof uad.getHighEntropyValues === "function") {
        uad
          .getHighEntropyValues([
            "model",
            "platformVersion",
            "architecture",
            "bitness",
            "uaFullVersion",
          ])
          .then(function (he) {
            UACH = {
              model: he.model || null,
              platform_version: he.platformVersion || null,
              arch: he.architecture || null,
              bitness: he.bitness || null,
              full_version: he.uaFullVersion || null,
            };
          })
          .catch(function () {})
          .then(function () { cb(); });
        return;
      }
    } catch (e) {}
    cb();
  }

  function clientContext() {
    var ctx = {};
    try {
      ctx.screen_w = window.screen && screen.width || null;
      ctx.screen_h = window.screen && screen.height || null;
      ctx.viewport_w = window.innerWidth || null;
      ctx.viewport_h = window.innerHeight || null;
      ctx.dpr = window.devicePixelRatio || null;
      ctx.language = (navigator.language || "").slice(0, 16);
      ctx.languages = Array.isArray(navigator.languages)
        ? navigator.languages.slice(0, 4).join(",")
        : null;
      ctx.color_scheme =
        (window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches)
          ? "dark" : "light";
      ctx.tz =
        (Intl && Intl.DateTimeFormat &&
         new Intl.DateTimeFormat().resolvedOptions().timeZone) || null;
      ctx.tz_offset = -new Date().getTimezoneOffset();
      var c = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
      if (c) {
        ctx.net_type = c.effectiveType || null;
        ctx.net_downlink = c.downlink || null;
        ctx.net_rtt = c.rtt || null;
        ctx.net_save_data = !!c.saveData;
      }
      ctx.touch = ("ontouchstart" in window) || (navigator.maxTouchPoints > 0);
      ctx.hardware_concurrency = navigator.hardwareConcurrency || null;
      ctx.device_memory = navigator.deviceMemory || null;
    } catch (e) {}
    return ctx;
  }

  function send(event, extra) {
    try {
      // Liitä client-konteksti pageview-eventtiin (kerran per session).
      var ev = event || "pageview";
      var enriched = Object.assign({}, BASE_EXTRA || {}, extra || {});
      if (ev === "pageview" || ev === "login_pageview") {
        Object.assign(enriched, clientContext());
      }
      var id = identity();
      var body = JSON.stringify({
        site: SITE,
        path: window.location.pathname + window.location.search,
        event: ev,
        referrer: document.referrer || "",
        utm: utm(),
        extra: Object.keys(enriched).length ? enriched : null,
        ch: UACH || undefined,
        self: SELF || undefined,
        user: id ? { email: id.email, name: id.name, sub: id.sub } : undefined,
        idToken: id && id.idToken ? id.idToken : undefined,
      });
      if (
        navigator.sendBeacon &&
        navigator.sendBeacon(
          ENDPOINT,
          new Blob([body], { type: "text/plain;charset=UTF-8" }),
        )
      ) {
        return;
      }
      fetch(ENDPOINT, {
        method: "POST",
        headers: { "content-type": "text/plain;charset=UTF-8" },
        body: body,
        keepalive: true,
        mode: "cors",
        credentials: "omit",
      }).catch(function () {});
    } catch (e) {}
  }

  function autoSend() {
    // Odota korkean entropian client hintit ennen ensimmäistä lähetystä, jotta
    // laitemalli ehtii mukaan. UACH jää talteen myös custom-eventtejä varten.
    resolveHighEntropy(function () { send(AUTO_EVENT); });
  }

  if (document.readyState === "complete" || document.readyState === "interactive") {
    autoSend();
  } else {
    document.addEventListener("DOMContentLoaded", autoSend);
  }

  window.mypa = { send: send, __initialized: true, __self: SELF };
})();

</script>
